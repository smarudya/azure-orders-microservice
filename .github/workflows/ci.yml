name: ci

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Orders.sln
      - name: Build
        run: dotnet build Orders.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Orders.sln --configuration Release --no-build
